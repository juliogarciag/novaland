<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Novaland</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
      canvas { display: block; }
      /* The connection screens (online mode): plain DOM over the canvas, so they show before the game exists. */
      #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: rgba(11, 15, 20, 0.85); color: #e2e8f0; font: 16px/1.4 monospace; text-align: center; z-index: 10; }
      #screen[hidden] { display: none; }
      #screen p { margin: 0; max-width: 32em; }
      #screen button { font: inherit; padding: 8px 16px; color: #e2e8f0; background: #1e293b; border: 1px solid #475569; border-radius: 4px; cursor: pointer; }
      #screen button:hover { background: #334155; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
