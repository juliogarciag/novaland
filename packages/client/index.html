<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Novaland</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
      canvas { display: block; }
      /* The mouse cursor over the game and its screens: a pixel-art arrow painted by tools/generate-cursors.mjs, clicking at its tip (0 0).
         The first rule is for browsers without image-set(); the second gives 2x screens their own image, so the arrow stays crisp there.
         `auto` is what shows if the image cannot load. Buttons keep their own pointer. */
      html { cursor: url('/cursors/arrow.png') 0 0, auto; cursor: image-set(url('/cursors/arrow.png') 1x, url('/cursors/arrow@2x.png') 2x) 0 0, auto; }
      /* The connection screens (online mode): plain DOM over the canvas, so they show before the game exists. */
      #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: rgba(11, 15, 20, 0.85); color: #e2e8f0; font: 16px/1.4 monospace; text-align: center; z-index: 10; }
      #screen[hidden] { display: none; }
      #screen p { margin: 0; max-width: 32em; }
      #screen button { font: inherit; padding: 8px 16px; color: #e2e8f0; background: #1e293b; border: 1px solid #475569; border-radius: 4px; cursor: pointer; }
      #screen button:hover { background: #334155; }
      /* The character creator: shown before the game exists, on a first visit or at #creator. */
      #creator { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: #0b0f14; color: #e2e8f0; font: 16px/1.4 monospace; z-index: 20; overflow-y: auto; padding: 16px; box-sizing: border-box; }
      #creator h1 { margin: 0; font-size: 20px; font-weight: normal; }
      #creator .creator-preview { image-rendering: pixelated; background: #1e293b; border: 1px solid #475569; border-radius: 4px; }
      #creator .creator-name { display: flex; flex-direction: column; gap: 4px; width: 24em; max-width: 100%; }
      #creator input[type="text"] { font: inherit; padding: 8px; color: #e2e8f0; background: #1e293b; border: 1px solid #475569; border-radius: 4px; }
      #creator input[type="text"][aria-invalid="true"] { border-color: #f87171; }
      #creator .creator-problem { margin: 0; min-height: 1.4em; max-width: 26em; color: #fca5a5; text-align: center; }
      #creator fieldset { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; padding: 0; border: 0; width: 24em; max-width: 100%; }
      #creator legend { float: left; width: 6em; padding: 0; }
      #creator .creator-swatch { position: relative; width: 28px; height: 28px; cursor: pointer; }
      #creator .creator-swatch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
      #creator .creator-swatch span { display: block; width: 100%; height: 100%; box-sizing: border-box; border: 2px solid #0b0f14; border-radius: 4px; outline: 1px solid #475569; }
      #creator .creator-swatch input:checked + span { outline: 3px solid #f8fafc; }
      #creator .creator-swatch input:focus-visible + span { outline: 3px solid #38bdf8; }
      #creator .creator-shape { position: relative; cursor: pointer; }
      #creator .creator-shape input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
      #creator .creator-shape span { display: block; padding: 4px 10px; border: 1px solid #475569; border-radius: 4px; background: #1e293b; }
      #creator .creator-shape input:checked + span { color: #0b0f14; background: #e2e8f0; border-color: #e2e8f0; }
      #creator .creator-shape input:focus-visible + span { outline: 3px solid #38bdf8; }
      #creator button { font: inherit; margin-top: 8px; padding: 8px 16px; color: #0b0f14; background: #e2e8f0; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; }
      #creator button:hover { background: #f8fafc; }
      /* The creator opened from inside the world: the game shows behind it and it can be closed. */
      #creator.creator-over-game { background: rgba(11, 15, 20, 0.82); }
      #creator .creator-close { position: absolute; top: 12px; right: 12px; margin: 0; padding: 0; width: 32px; height: 32px; font-size: 22px; line-height: 1;
        color: #e2e8f0; background: #1e293b; border: 1px solid #475569; }
      #creator .creator-close:hover { background: #334155; }
      /* The way back to the creator from inside the world. In the bottom corner: the top right one is the minimap's. */
      #change-character { position: fixed; bottom: 12px; right: 12px; z-index: 5; font: 14px/1.4 monospace; padding: 4px 10px; color: #94a3b8;
        background: rgba(11, 15, 20, 0.6); border: 1px solid #475569; border-radius: 4px; cursor: pointer; }
      #change-character:hover { color: #e2e8f0; background: #1e293b; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
